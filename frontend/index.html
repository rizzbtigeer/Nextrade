<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <!-- ===== SEO par défaut (écrasé par react-helmet par page) ===== -->
    <title>NexTrade — Achats en gros pour revendeurs</title>
    <meta
      name="description"
      content="Habits, chaussures, montres et plus, au prix de gros. Commandez et négociez directement sur WhatsApp."
    />
    <meta name="author" content="NexTrade" />
    <meta name="robots" content="index, follow" />

    <!-- ===== FAVICON ===== -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- ===== PRÉCHARGEMENT (perf) ===== -->
    <link rel="preload" as="image" href="/hero/hero-1.jpg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ===== OPEN GRAPH (fallback) ===== -->
    <meta property="og:title" content="NexTrade — Achats en gros pour revendeurs" />
    <meta
      property="og:description"
      content="Habits, chaussures, montres et plus, au prix de gros."
    />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_CM" />

    <!-- ===== TWITTER ===== -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ===== FONTS ===== -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
