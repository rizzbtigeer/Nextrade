<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>NexTrade — Achats en gros pour revendeurs</title>
    <meta name="description" content="Habits, chaussures, montres et plus, au prix de gros. Commandez et négociez directement sur WhatsApp." />
    
    <!-- ===== FAVICON (Logo comme icône) ===== -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Précharge la première image du carrousel : c'est elle que le visiteur
         voit en premier, donc celle qui compte le plus pour la vitesse perçue -->
    <link rel="preload" as="image" href="/hero/hero-1.jpg" fetchpriority="high" />
    
    <!-- ===== OPEN GRAPH ===== -->
    <meta property="og:title" content="NexTrade — Achats en gros pour revendeurs" />
    <meta property="og:description" content="Habits, chaussures, montres et plus, au prix de gros." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    
    <!-- ===== FONTS ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
